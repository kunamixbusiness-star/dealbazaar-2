<!DOCTYPE html>
<html>
<head>
  <title>DealBazar - Pan India Deal Platform</title>
  <style>
    body { font-family: Arial; background: #f0f0f0; padding: 20px; }
    .box { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px #ccc; }
    input, select, textarea, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; }
    button { background: #28a745; color: white; border: none; cursor: pointer; }
    button:hover { background: #218838; }
    .deal { border-left: 5px solid #007bff; padding: 10px; margin: 10px 0; background: #e9f5ff; }
    .commission { color: green; font-weight: bold; }
    .upi { color: red; font-size: 18px; }
  </style>
</head>
<body>
  <h1>🤝 DealBazar - Har Kaam Ki Deal</h1>
  <p><b>Pan India + Worldwide</b> | Tumhara Commission: 20% Auto</p>

  <div class="box">
    <h2>Deal Post Karo</h2>
    <input id="title" placeholder="Kaam kya hai? Ex: Website, Logo, Video Edit">
    <textarea id="desc" placeholder="Description"></textarea>
    <input id="budget" type="number" placeholder="Budget Rs. me">
    <input id="location" placeholder="Location - India ya Country ka naam">
    <input id="postedBy" placeholder="Tumhara Naam">
    <button onclick="postDeal()">Deal Post Karo</button>
  </div>

  <div class="box">
    <h2>Saari Deals</h2>
    <div id="dealsList">Loading...</div>
  </div>

<script>
async function postDeal() {
  const data = {
    title: document.getElementById('title').value,
    description: document.getElementById('desc').value,
    budget: parseInt(document.getElementById('budget').value),
    location: document.getElementById('location').value,
    postedBy: document.getElementById('postedBy').value
  };
  await fetch('/post-deal', {method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)});
  alert('Deal Post ho gayi!');
  loadDeals();
}

async function acceptDeal(id) {
  const name = prompt('Freelancer ka naam likho:');
  await fetch('/accept-deal/'+id, {method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({acceptedBy: name})});
  alert('Deal Accept ho gayi!');
  loadDeals();
}

async function completeDeal(id) {
  const res = await fetch('/complete-deal/'+id, {method: 'POST'});
  const data = await res.json();
  alert(`Payment Released!\nUPI: ${data.yourUPI}\nTumhara Commission: Rs.${data.yourCommission}`);
  loadDeals();
}

async function loadDeals() {
  const res = await fetch('/deals');
  const deals = await res.json();
  let html = '';
  deals.forEach(d => {
    html += `<div class="deal">
      <h3>${d.title} - Rs.${d.budget}</h3>
      <p>${d.description}</p>
      <p><b>Location:</b> ${d.location} | <b>By:</b> ${d.postedBy}</p>
      <p><b>Status:</b> ${d.status}</p>
      <p class="commission">Tumhara 20% Commission: Rs.${d.yourCommission}</p>
      ${d.status==='open' ? `<button onclick="acceptDeal('${d.id}')">Deal Accept Karo</button>` : ''}
      ${d.status==='accepted' ? `<button onclick="completeDeal('${d.id}')">Deal Complete + UPI Lo</button>` : ''}
    </div>`;
  });
  document.getElementById('dealsList').innerHTML = html;
}
loadDeals();
</script>
</body>
</html>
